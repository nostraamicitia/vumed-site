<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pagina niet gevonden – VUmed</title>
<!-- 404.html wordt door GitHub Pages én Cloudflare Pages op ELK pad geserveerd
     (ook /a/b/c), dus alle verwijzingen hier zijn ABSOLUUT (/...). -->
<link rel="icon" type="image/png" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script>
  // Hoofdletters in de URL (/Admin, /Dashboard.html) → lowercase-variant proberen.
  (function () {
    var p = location.pathname;
    if (p !== p.toLowerCase()) { location.replace(p.toLowerCase() + location.search + location.hash); return; }
    // /admin/ → /admin
    if (p.length > 1 && p.charAt(p.length - 1) === '/') location.replace(p.slice(0, -1) + location.search + location.hash);
  })();
  try {
    var t = localStorage.getItem('vumed_theme');
    var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
</script>
<style>
  :root { --bg:#fff; --card:#fff; --ink:#1C1C1E; --muted:#6E6E73; --line:#E5E5EA; --blue:#1CB0F6; --blue-d:#0E85B5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000; --card:#1C1C1E; --ink:#F2F2F7; --muted:#98989D; --line:#2C2C2E; } }
  :root[data-theme="dark"] { --bg:#000; --card:#1C1C1E; --ink:#F2F2F7; --muted:#98989D; --line:#2C2C2E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'Nunito', Arial, sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh;
         padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 440px; text-align: center; }
  .monitor { background: linear-gradient(135deg, var(--blue), var(--blue-d)); border-radius: 18px; padding: 18px 14px 12px;
             position: relative; overflow: hidden; margin-bottom: 24px; }
  .monitor svg { width: 100%; height: auto; display: block; overflow: visible; }
  .trace { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
           stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.2s ease-out .2s forwards; }
  .readout { display: flex; justify-content: space-between; color: rgba(255,255,255,.85);
             font-size: 12px; font-weight: 800; letter-spacing: .6px; margin-top: 8px; }
  .readout b { color: #fff; }
  .blink { animation: blink 1s steps(2, start) infinite; }
  h1 { font-size: 64px; line-height: 1; margin: 0 0 6px; font-weight: 900; color: var(--blue); letter-spacing: -1px; }
  h2 { font-size: 20px; margin: 0 0 8px; font-weight: 900; }
  p { margin: 0 0 22px; color: var(--muted); font-weight: 600; font-size: 15px; line-height: 1.5; }
  .btn { display: block; width: 100%; padding: 14px 20px; border-radius: 14px; font-family: inherit; font-weight: 800;
         font-size: 15px; text-decoration: none; cursor: pointer; border: none; }
  .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); margin-bottom: 10px; }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-d); }
  .btn-ghost { background: transparent; color: var(--blue); border: 1.5px solid var(--line); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .trace { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
</style>
</head>
<body>
  <main class="card">
    <div class="monitor" aria-hidden="true">
      <svg viewBox="0 0 300 70">
        <!-- twee hartslagen, daarna … asystolie -->
        <path class="trace" pathLength="1"
              d="M0 40 H30 L36 34 L42 40 H52 L58 8 L66 62 L72 40 H86 L94 32 L104 40 H120 L126 34 L132 40 H142 L148 8 L156 62 L162 40 H176 L184 32 L194 40 H300"/>
      </svg>
      <div class="readout"><span>HR <b class="blink">--</b></span><span>SpO₂ <b>404</b></span><span class="blink">● ASYSTOLIE</span></div>
    </div>
    <h1>404</h1>
    <h2>Deze pagina heeft geen hartslag</h2>
    <p>We konden deze pagina niet vinden. Misschien is de link verouderd of zit er een typfout in.</p>
    <a class="btn btn-primary" href="/dashboard.html">Terug naar VUmed</a>
    <button class="btn btn-ghost" type="button" onclick="history.length > 1 ? history.back() : location.href='/dashboard.html'">Vorige pagina</button>
  </main>
</body>
</html>
