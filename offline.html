<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Even geen verbinding – VUmed</title>
<!-- Getoond door sw.js als het netwerk faalt of de server een 5xx geeft
     (bv. GitHub-storing) en er geen gecachete kopie van de pagina is.
     Volledig zelfstandig: geen externe fonts/scripts, want die laden dan ook niet. -->
<script>
  try {
    var t = localStorage.getItem('vumed_theme');
    var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
</script>
<style>
  :root { --bg:#fff; --card:#fff; --ink:#1C1C1E; --muted:#6E6E73; --line:#E5E5EA; --blue:#1CB0F6; --blue-d:#0E85B5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000; --card:#1C1C1E; --ink:#F2F2F7; --muted:#98989D; --line:#2C2C2E; } }
  :root[data-theme="dark"] { --bg:#000; --card:#1C1C1E; --ink:#F2F2F7; --muted:#98989D; --line:#2C2C2E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'Nunito', -apple-system, system-ui, Arial, sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh;
         padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 440px; text-align: center; }
  /* ECG als echte monitor-sweep: een cursor tekent de nieuwe meting over de
     oude heen; vlak vóór de cursor wordt een stukje van de oude lijn gewist. */
  .monitor { margin: 0 0 28px; }
  .monitor svg { width: 100%; height: auto; display: block; overflow: visible; }
  .trace { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .trace.old { opacity: .55; }
  .cursor { fill: var(--blue); filter: drop-shadow(0 0 4px rgba(28,176,246,.9)); }
  h2 { font-size: 21px; margin: 0 0 8px; font-weight: 900; }
  p { margin: 0 0 22px; color: var(--muted); font-weight: 600; font-size: 15px; line-height: 1.5; }
  .btn { display: block; width: 100%; padding: 14px 20px; border-radius: 14px; font-family: inherit; font-weight: 800;
         font-size: 15px; text-decoration: none; cursor: pointer; border: none; }
  .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-d); }
</style>
</head>
<body>
  <main class="card">
    <div class="monitor" aria-hidden="true">
      <svg viewBox="0 0 300 70">
        <defs>
          <clipPath id="clipNew"><rect id="rNew" x="0" y="-10" width="0" height="90"/></clipPath>
          <clipPath id="clipOld"><rect id="rOld" x="300" y="-10" width="300" height="90"/></clipPath>
        </defs>
        <path id="old" class="trace old" clip-path="url(#clipOld)" d=""/>
        <path id="new" class="trace" clip-path="url(#clipNew)" d=""/>
        <circle id="cur" class="cursor" r="3" cx="0" cy="40"/>
      </svg>
    </div>
    <h2>Even geen verbinding</h2>
    <p>VUmed is nu niet bereikbaar. Dat ligt aan je internet of aan een korte storing bij onze hosting. We proberen het automatisch opnieuw.</p>
    <button class="btn btn-primary" type="button" id="retry">Opnieuw proberen</button>
  </main>
  <script>
    // Automatisch opnieuw proberen (stil, met oplopende wachttijd).
    (function () {
      var wait = 10, left = wait;
      function go() { location.reload(); }
      document.getElementById('retry').addEventListener('click', go);
      window.addEventListener('online', go);
      setInterval(function () {
        if (!navigator.onLine) return;
        if (--left <= 0) { wait = Math.min(wait * 2, 60); left = wait; go(); }
      }, 1000);
    })();

    // ECG-sweep zoals op een echte monitor.
    (function () {
      var W = 300, BASE = 40, GAP = 12, SWEEP_MS = 3200;
      var pNew = document.getElementById('new'), pOld = document.getElementById('old');
      var rNew = document.getElementById('rNew'), rOld = document.getElementById('rOld');
      var cur = document.getElementById('cur');
      function r(a, b) { return a + Math.random() * (b - a); }
      // Eén complex: P-top, QRS, T-top — met kleine variatie per slag.
      function beat(x) {
        var q = r(0, 2), rr = r(6, 10), s = r(58, 63), t = r(28, 32);
        return ' L' + x + ' ' + BASE +
          ' Q' + (x + 5) + ' ' + (BASE - 7) + ' ' + (x + 10) + ' ' + BASE +
          ' L' + (x + 16) + ' ' + BASE + ' L' + (x + 19) + ' ' + (BASE + 3 + q) +
          ' L' + (x + 24) + ' ' + rr + ' L' + (x + 30) + ' ' + s + ' L' + (x + 34) + ' ' + BASE +
          ' L' + (x + 45) + ' ' + BASE + ' Q' + (x + 54) + ' ' + t + ' ' + (x + 63) + ' ' + BASE;
      }
      function trace() {
        var d = 'M0 ' + BASE, x = r(8, 40);
        while (x + 64 < W) { d += beat(x); x += 64 + r(26, 40); }
        return d + ' L' + W + ' ' + BASE;
      }
      // y per x opzoeken voor de cursor
      var ys = [];
      function sample() {
        ys = []; var L = pNew.getTotalLength(), i, pt;
        for (i = 0; i <= L; i += 0.5) { pt = pNew.getPointAtLength(i); ys[Math.round(pt.x)] = pt.y; }
        for (i = 0; i <= W; i++) if (ys[i] == null) ys[i] = i ? ys[i - 1] : BASE;
      }
      function set(x) {
        rNew.setAttribute('width', x);
        rOld.setAttribute('x', x + GAP);
        cur.setAttribute('cx', x); cur.setAttribute('cy', ys[Math.min(W, Math.round(x))]);
      }
      pNew.setAttribute('d', trace()); sample();
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
        set(W); cur.style.display = 'none'; return;
      }
      var t0 = null;
      function frame(t) {
        if (t0 === null) t0 = t;
        var x = (t - t0) / SWEEP_MS * W;
        if (x >= W) {                       // nieuwe sweep: huidige meting wordt de "oude"
          pOld.setAttribute('d', pNew.getAttribute('d'));
          pNew.setAttribute('d', trace()); sample();
          t0 = t; x = 0;
        }
        set(x);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
